[project]
name = "ziglag"
version = "0.2.0"
description = "Self-hosted invoicing app built on the stk framework"
authors = [
    {name = "Level09", email = "hello@level09.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "stkit>=17.15.1,<18",
    "fpdf2>=2.8.0",
]


[project.optional-dependencies]
full = ["stkit[full]"]  # PostgreSQL and Redis

[dependency-groups]
dev = ["stkit[dev]"]

[tool.stk]
app = "ziglag.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ziglag"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "C901",   # complexity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ziglag"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
