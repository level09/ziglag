<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZigLag - Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #fbf9f8; color: #1b1c1c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .setup-card {
            background: #fff; border: 3px solid #1b1c1c; box-shadow: 8px 8px 0 0 rgba(0,0,0,1);
            padding: 48px; max-width: 460px; width: 100%; margin: 24px;
        }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #464653; margin-bottom: 32px; }
        label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #464653; display: block; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; border: 2px solid #1b1c1c; font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 15px; margin-bottom: 20px; background: #fbf9f8; outline: none;
        }
        input:focus { box-shadow: 3px 3px 0 0 rgba(53, 58, 175, 0.3); border-color: #353aaf; }
        button {
            width: 100%; padding: 14px; background: #4e54c8; color: #fff; border: 2px solid #1b1c1c;
            box-shadow: 4px 4px 0 0 rgba(0,0,0,1); font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.02em;
            cursor: pointer; margin-top: 8px;
        }
        button:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 rgba(0,0,0,1); }
        button:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
        .step { font-family: 'Inter', sans-serif; font-size: 11px; color: #767685; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
        .flash { background: #fef2f2; border: 2px solid #ba1a1a; color: #ba1a1a; padding: 10px 14px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="step">First time setup</div>
        <div class="logo">ZigLag</div>
        <div class="subtitle">Create your admin account to get started.</div>

        {% set messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}

        <form method="POST" action="/setup">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" autofocus>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@company.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Min 12 characters" required minlength="12">

            <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
